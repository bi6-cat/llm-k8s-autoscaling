# ──────────────────────────────────────────────────────────────────────────────
# platform/keda/values.yaml
# Khái niệm: Values cho chart KEDA 2.21.0. KEDA gồm 3 thành phần: operator (theo dõi ScaledObject, tạo
#            HPA, gọi Prometheus), metrics server (trả giá trị metric cho HPA qua External Metrics API)
#            và admission webhook (kiểm tra ScaledObject hợp lệ trước khi tạo).
# Mục đích:  Đặt requests/limits nhỏ: cluster chỉ có vài ScaledObject, mặc định của chart (request
#            100m CPU, 100Mi; limit 1 CPU, 1000Mi) dư thừa với PC 16 GB RAM. Tắt keep-alive khi gọi
#            Prometheus để bài T4, VH4 cắt được đường KEDA → Prometheus. Dùng chung cho nhà (Argo CD)
#            và simulator (Makefile).
# Tham khảo: docs/huong-dan/w2.md §7. Dựa trên bản nháp của Quang (temp/w2-scaffold, 12c4e27).
# ──────────────────────────────────────────────────────────────────────────────
# requests: phần scheduler giữ chỗ trên node. limits.memory: vượt thì container bị kill (OOMKilled).
# Không đặt limit CPU: thành phần điều khiển bị bóp CPU (throttle) thì quyết định scale chậm theo.
# Lưu ý: Helm GỘP file này vào values mặc định của chart chứ không thay thế. Mặc định có limits.cpu: 1,
# nên chỉ ghi limits.memory thì limit CPU vẫn còn; `cpu: null` mới xoá được key đó.
resources:
  operator:
    requests: {cpu: 50m, memory: 100Mi}       # 50m = 0,05 lõi
    limits: {cpu: null, memory: 512Mi}
  metricServer:
    requests: {cpu: 50m, memory: 100Mi}
    limits: {cpu: null, memory: 512Mi}
  webhooks:
    requests: {cpu: 10m, memory: 50Mi}
    limits: {cpu: null, memory: 256Mi}

# Biến môi trường cho mọi thành phần KEDA. KEDA_HTTP_DISABLE_KEEP_ALIVE=true: mỗi lần hỏi Prometheus mở
# kết nối mới, thay vì dùng lại kết nối keep-alive trong pool chung (pkg/util/http.go của KEDA v2.21.0).
# Lý do: NetworkPolicy chỉ chặn kết nối MỚI. Với keep-alive, KEDA hỏi mỗi 5 s nên kết nối không bao giờ
# rảnh để đóng, và cách gây sự cố của T4/VH4 (NetworkPolicy chặn KEDA → Prometheus, ADR-005 T6) không gây
# được lỗi nào: ngày 01/11, áp policy 120 s mà KEDA không lỗi lần nào. Chi phí: thêm một lần bắt tay TCP
# trong cluster cho mỗi lần hỏi (vài lần mỗi 5 s), không đáng kể.
env:
  - name: KEDA_HTTP_DISABLE_KEEP_ALIVE
    value: "true"
