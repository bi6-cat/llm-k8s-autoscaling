# ──────────────────────────────────────────────────────────────────────────────
# platform/gpu/device-plugin-values-home.yaml
# Khái niệm: Time-slicing = device plugin khai báo MỘT GPU thật thành nhiều GPU replica. Node báo
#            `nvidia.com/gpu: 2` dù chỉ có 1 card; mỗi pod xin `nvidia.com/gpu: 1` nhận một phần, các
#            pod dùng chung các nhân GPU theo kiểu time-slicing. KHÔNG chia VRAM: mọi pod thấy toàn bộ
#            8 GB, nên mỗi pod vLLM phải tự giới hạn bằng --gpu-memory-utilization (overlay home).
# Mục đích:  Có 2 replica vLLM trên một RTX 5060 để kiểm CHỨC NĂNG nhiều replica ở nhà (KB2-mini
#            1 → 2, VH1, VH2, VH3) mà không cần laptop 4050. Các pod dùng chung GPU nên số đo hiệu năng ở
#            nhà không dùng được; đo hiệu năng trên máy thuê (ADR-004 §7, 06/11/2026).
#            CHỈ dùng cho nhà. Cài chồng lên file chung:
#              helm upgrade -i nvdp nvdp/nvidia-device-plugin --version 0.20.1 -n gpu \
#                -f platform/gpu/device-plugin-values.yaml -f platform/gpu/device-plugin-values-home.yaml
#            (Helm gộp các file -f theo thứ tự, file sau ghi đè file trước.)
# Tham khảo: https://github.com/NVIDIA/k8s-device-plugin#shared-access-to-gpus, Môi trường §2.4
# ──────────────────────────────────────────────────────────────────────────────

config:
  # Chart tạo ConfigMap từ `map` (tên cấu hình → nội dung) và chạy thêm sidecar config-manager đọc nó.
  # `default` = tên cấu hình áp cho mọi node không có nhãn nvidia.com/device-plugin.config riêng.
  default: time-slicing
  map:
    time-slicing: |-
      version: v1
      sharing:
        timeSlicing:
          # false: giữ nguyên tên tài nguyên `nvidia.com/gpu` (không đổi thành nvidia.com/gpu.shared),
          # nên manifest vLLM ở base không phải sửa gì.
          renameByDefault: false
          # Pod xin > 1 GPU replica thì bị từ chối ngay, thay vì nhận 2 phần của CÙNG một card mà tưởng là
          # 2 GPU.
          failRequestsGreaterThanOne: true
          resources:
            - name: nvidia.com/gpu
              # 2 GPU replica trên RTX 5060 8 GB: 2 pod × 0,40 × 8 GB ≈ 6,5 GB, còn ~1,2 GB cho màn hình.
              # Không để 3: đo ngày 06/11, một pod vLLM 0,5B cần ~3,3 GB VRAM và ~3,4 GiB RAM, nên pod
              # thứ 3 vượt cả VRAM lẫn RAM (PC ~14 GiB dùng được). Replica thừa chỉ làm pod thứ 3 lên
              # rồi chết vì thiếu VRAM.
              replicas: 2
