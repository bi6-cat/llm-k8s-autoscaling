# ──────────────────────────────────────────────────────────────────────────────
# platform/argocd/apps/home/monitoring.yaml
# Khái niệm: kube-prometheus-stack = một chart gom Prometheus Operator, Prometheus, Alertmanager,
#            Grafana, kube-state-metrics và node-exporter. Operator quản lý Prometheus qua CRD
#            (PodMonitor, PrometheusRule…).
# Mục đích:  Cài chart (phiên bản ghim) với HAI file values: chung (values.yaml) rồi riêng cho nhà
#            (values-home.yaml). File sau ghi đè file trước. Cấu trúc giống gpu-device-plugin.yaml.
# Tham khảo: docs/huong-dan/w2.md §4.3, §6
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.1.1           # phải trùng KPS_VERSION trong Makefile
      helm:
        releaseName: kps               # tên ngắn: Service là kps-prometheus, kps-grafana
        valueFiles:
          - $values/platform/kube-prometheus-stack/values.yaml
          - $values/platform/kube-prometheus-stack/values-home.yaml
    - repoURL: https://github.com/bi6-cat/llm-k8s-autoscaling.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: monitoring}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    # ServerSideApply: CRD của Prometheus Operator rất lớn (cùng lý do như keda.yaml)
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 5m}}
