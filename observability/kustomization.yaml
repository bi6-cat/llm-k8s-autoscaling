# ──────────────────────────────────────────────────────────────────────────────
# observability/kustomization.yaml
# Khái niệm: Kustomization = danh sách manifest mà `kubectl apply -k <thư mục>` (hoặc Argo CD) áp cùng lúc.
# Mục đích:  Gom recording rule và cảnh báo thành một đơn vị triển khai. Giống nhau ở mọi môi trường
#            (home, cloud, sim) nên không có overlay. Dashboard (TR3) thêm vào đây sau.
#            Chưa có Application Argo CD trỏ vào đây: thêm khi merge phần Argo CD (Kiến trúc §18.1,
#            monitoring-extras). Trước đó áp tay: kubectl apply -k observability.
# Tham khảo: Kiến trúc §17.2, §18.1
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rules/slo.yaml
  - rules/vllm.yaml
  - alerts/llm.yaml
