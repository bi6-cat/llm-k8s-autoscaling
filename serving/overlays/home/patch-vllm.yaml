# ──────────────────────────────────────────────────────────────────────────────
# serving/overlays/home/patch-vllm.yaml
# Khái niệm: JSON Patch (RFC 6902) = danh sách thao tác lên Deployment của base. Mỗi mục có `op`
#            (add = thêm, replace = thay, remove = xoá) và `path` (đường tới trường: /spec/…/args/-
#            với `-` nghĩa là "nối vào cuối danh sách"; /volumes/0 là phần tử đầu tiên).
#            Dùng JSON patch thay vì merge patch: merge sẽ thay CẢ danh sách args (mất tham số của base),
#            và gộp hai nguồn vào một volume (Kubernetes từ chối) – xem w2.md §8.2.
# Mục đích:  Model 0,5B nhỏ để 2 pod chạy chung một RTX 5060 nhờ time-slicing
#            (platform/gpu/device-plugin-values-home.yaml), giới hạn RAM, cache model trên ổ (hostPath).
#            Nhà chỉ kiểm CHỨC NĂNG nhiều replica; số đo hiệu năng lấy ở máy thuê (ADR-004 §7).
#            Giá trị theo cột "Nhà" ở Thông số §9.1–§9.2.
# Tham khảo: docs/huong-dan/w2.md §8.2
# ──────────────────────────────────────────────────────────────────────────────

# Model 0,5B (~1 GB ở BF16, KV-cache ~12 KB/token). Đổi từ 1,5B ngày 06/11: 1,5B (~3,1 GB) chỉ vừa
# 1 pod trên 8 GB, còn 0,5B để được 2 pod. Số đo LT1–LT3 và capacity-home-1.5b.json là của 1,5B.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --model=Qwen/Qwen2.5-0.5B-Instruct
# Ghim đúng một phiên bản (commit) của model trên Hugging Face (yêu cầu N8)
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --revision=7ae557604adf67be50417f59c2c2f167def9a775
# Tên model mà client gửi trong trường "model" của request (ngắn, không đổi khi đổi revision)
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --served-model-name=qwen2.5-0.5b
# Độ dài tối đa (prompt + output, tính bằng token) của một request. Càng nhỏ thì càng ít VRAM phải
# dành cho KV-cache mỗi request, nên càng nhiều request chạy song song được. 2048 đủ cho prompt của
# loadgen ở nhà (kiểm chức năng, không cần ngữ cảnh dài).
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --max-model-len=2048
# Số request tối đa vLLM xử lý cùng lúc trong một batch; vượt thì request phải xếp hàng (waiting).
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --max-num-seqs=16           # 16 × 2048 token × 12 KB ≈ 0,4 GB KV-cache, vừa phần VRAM bên dưới
# Phần VRAM MỖI pod vLLM được dùng (weights + activation + KV-cache), tính theo tổng VRAM của card.
# Time-slicing không chia VRAM nên phải tự chia: 0,40 × 8 GB ≈ 3,3 GB/pod; 2 pod ≈ 6,5 GB, chừa
# ~1,2 GB cho màn hình (Ubuntu desktop dùng ~1,2 GB, đo 06/11).
# Lưu ý (06/11): 0,25 (~2 GB) KHÔNG đủ: weights 0,93 GiB + CUDA context + CUDA graph lấp hết, vLLM thoát với
# "No available memory for the cache blocks". Vì vậy ở nhà chỉ chạy được 2 pod, không phải 3.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --gpu-memory-utilization=0.40
# CPU/RAM cho 2 pod trên PC (~14 GiB dùng được, 12 luồng). requests: phần giữ chỗ để scheduler xếp
# pod; limits.memory: vượt thì bị kill (OOM). Đo 06/11 (`kubectl top pod`): một pod vLLM 0,5B dùng
# ~3,3–3,4 GiB RAM lúc khởi động, nên request 3,5Gi và limit 5Gi để còn khoảng dư. Giữ nvidia.com/gpu
# (= 1 GPU replica) trong limits vì `replace` thay cả khối resources của base.
# Lưu ý (06/11): 2 pod sát giới hạn RAM của PC khi còn chạy desktop (GNOME, VS Code…, ~4–5 GB).
# Chạy được khi trước lúc scale còn ≥ ~5 GB RAM khả dụng (sau đó còn ~1,7 GB). Lần thử khi chỉ còn
# ~3 GB thì máy không có swap nên thrash, API server timeout và PC treo tới khi khởi động lại
# (docs/nhat-ky/van-hanh.md). Trước khi lên 2 pod: kiểm `free -m`, và nên chạy watchdog RAM.
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests: {cpu: "1", memory: 3584Mi}
    limits: {nvidia.com/gpu: 1, memory: 5Gi}
# Cache trên ổ của node, dùng chung cho mọi pod trên PC (và laptop nếu sau này thêm), nạp lại nhanh.
# Không dùng PVC local-path vì PVC đó chỉ gắn được vào một node: pod trên node khác sẽ Pending.
# DirectoryOrCreate: thư mục chưa có thì kubelet tự tạo.
- op: replace
  path: /spec/template/spec/volumes/0
  value:
    name: cache
    hostPath: {path: /var/lib/llm-cache, type: DirectoryOrCreate}
# /dev/shm dạng Memory tính vào giới hạn RAM 4Gi của pod; 512 MiB đủ cho 1 GPU, model nhỏ
# (base để 8Gi cho cloud)
- op: replace
  path: /spec/template/spec/volumes/1
  value:
    name: dshm
    emptyDir: {medium: Memory, sizeLimit: 512Mi}
