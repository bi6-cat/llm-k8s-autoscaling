# ──────────────────────────────────────────────────────────────────────────────
# serving/overlays/home/patch-vllm.yaml
# Khái niệm: JSON Patch (RFC 6902) = danh sách thao tác lên Deployment của base. Mỗi mục có `op`
#            (add = thêm, replace = thay, remove = xoá) và `path` (đường tới trường: /spec/…/args/-
#            với `-` nghĩa là "nối vào cuối danh sách"; /volumes/0 là phần tử đầu tiên).
#            Dùng JSON patch thay vì merge patch: merge sẽ thay CẢ danh sách args (mất tham số của base),
#            và gộp hai nguồn vào một volume (Kubernetes từ chối) – xem w2.md §8.2.
# Mục đích:  Model 1,5B, giới hạn RAM, cache model trên ổ từng node (hostPath).
#            Giá trị theo cột "Nhà" ở Thông số §9.1–§9.2.
# Tham khảo: docs/huong-dan/w2.md §8.2
# ──────────────────────────────────────────────────────────────────────────────

# Model 1,5B (~3,1 GB ở BF16) vừa cả RTX 5060 8 GB lẫn RTX 4050 6 GB, còn chỗ cho KV-cache.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --model=Qwen/Qwen2.5-1.5B-Instruct
# Ghim đúng một phiên bản (commit) của model trên Hugging Face (yêu cầu N8)
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --revision=989aa7980e4cf806f80c7fef2b1adb7bc71aa306
# Tên model mà client gửi trong trường "model" của request (ngắn, không đổi khi đổi revision)
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --served-model-name=qwen2.5-1.5b
# Độ dài tối đa (prompt + output, tính bằng token) của một request. Càng nhỏ thì càng ít VRAM phải
# dành cho KV-cache mỗi request, nên càng nhiều request chạy song song được.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --max-model-len=4096
# Số request tối đa vLLM xử lý cùng lúc trong một batch; vượt thì request phải xếp hàng (waiting).
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --max-num-seqs=32
# Phần VRAM vLLM được dùng (weights + KV-cache). 0,85 chừa ~15% cho màn hình và CUDA context;
# RTX 5060 ở nhà còn chạy màn hình nếu Ubuntu có giao diện.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --gpu-memory-utilization=0.85
# CPU/RAM vừa với PC 16 GB và laptop. requests: phần giữ chỗ; limits.memory: vượt thì bị kill (OOM).
# Giữ nvidia.com/gpu trong limits vì `replace` thay cả khối resources của base.
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests: {cpu: "2", memory: 5Gi}
    limits: {nvidia.com/gpu: 1, memory: 8Gi}
# Cache trên ổ của TỪNG node: pod chạy trên PC hay laptop đều có cache riêng, nạp lại nhanh.
# Không dùng PVC local-path vì PVC đó chỉ gắn được vào một node: pod thứ hai trên laptop sẽ Pending.
# DirectoryOrCreate: thư mục chưa có thì kubelet tự tạo.
- op: replace
  path: /spec/template/spec/volumes/0
  value:
    name: cache
    hostPath: {path: /var/lib/llm-cache, type: DirectoryOrCreate}
# /dev/shm dạng Memory tính vào giới hạn RAM 8Gi của pod; 1 GiB là đủ cho 1 GPU (base để 8Gi cho cloud)
- op: replace
  path: /spec/template/spec/volumes/1
  value:
    name: dshm
    emptyDir: {medium: Memory, sizeLimit: 1Gi}
