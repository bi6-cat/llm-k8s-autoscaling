# ──────────────────────────────────────────────────────────────────────────────
# serving/overlays/cloud-3b/kustomization.yaml                      (DEMO – chốt sau phiên thử 3B)
# Khái niệm: Overlay chồng lên overlay: lấy NGUYÊN overlay `cloud` (model 7B) làm đầu vào, rồi chỉ đổi
#            phần phụ thuộc model. Vẫn là môi trường `cloud` (VM thuê), chỉ khác biến thể model.
# Mục đích:  Thử Qwen2.5-3B trên VM thuê có GPU 16 GB (ví dụ 4 × RTX A4000), rẻ hơn 4 × 4090 khoảng
#            3 lần, trước khi nhóm quyết định 3B hay 7B cho V2. Overlay `cloud` giữ nguyên, nên quay
#            về 7B chỉ cần apply lại `serving/overlays/cloud`.
# Dùng:      kubectl kustomize serving/overlays/cloud-3b     (xem kết quả)
#            kubectl apply -k serving/overlays/cloud-3b      (áp tay trên VM thử)
# Tham khảo: Thông số §9.1; docs/nhat-ky/lam-viec/quang/tuan-05.md (khảo sát giá 06/11)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Trỏ tới THƯ MỤC overlay cloud (một kustomization khác) thì được phép; trỏ tới file lẻ ngoài thư mục
  # này thì kustomize chặn (load restrictor), nên không dùng lại patch của cloud theo kiểu file.
  # Lưu ý: không đặt thư mục này BÊN TRONG cloud/: kustomize báo "cycle detected" vì thư mục cha chứa
  # chính overlay đang trỏ về nó (gặp 06/11).
  - ../cloud
patches:
  - path: patch-vllm.yaml
    target: {kind: Deployment, name: vllm}
