# ──────────────────────────────────────────────────────────────────────────────
# common/platform/kube-state-metrics-values.yaml
# Khái niệm: Lớp values cho chart kube-prometheus-stack 92.1.1 (khoá `kube-state-metrics`, chart con 8.6.0,
#            KSM v2.20.0). kube-state-metrics (KSM) đọc object từ API server rồi xuất thành metric, ví dụ
#            kube_pod_status_phase. "Custom resource state" = cho KSM đọc thêm object của CRD (ở đây là
#            ScaledObject của KEDA) theo cấu hình khai báo dưới đây.
# Mục đích:  Xuất condition của ScaledObject thành metric kube_scaledobject_status_condition, để cảnh báo
#            KedaScalerErrors bắt được trạng thái Fallback=True. Không dùng bộ đếm lỗi của KEDA được:
#            từ lần lỗi liên tiếp thứ failureThreshold + 1, KEDA trả giá trị fallback với err = nil nên
#            keda_scaler_detail_errors_total đứng yên suốt thời gian fallback (KEDA v2.21.0
#            pkg/fallback/fallback.go; đo trên kind 15/11: bộ đếm = 1 trong khi numberOfFailures = 67).
#            Tách khỏi kube-prometheus-stack-values.yaml vì file đó cũng là values của Argo CD ở nhà: bật ở
#            sim và cloud trước, ở nhà thêm khi kiểm được trên cluster nhà (việc 6b).
# Lưu ý:     Chart luôn truyền --resources=<danh sách collector có sẵn>; custom resource vẫn được thu (đã
#            kiểm trên kind, nhật ký 15/11). Condition có status "Unknown" thì KSM ghi 0, giống "False".
# Tham khảo: KSM v2.20.0 docs/metrics/extend/customresourcestate-metrics.md (mục status conditions);
#            chart kube-state-metrics 8.6.0 values.yaml (customResourceState, rbac.extraRules);
#            common/observability/alerts/llm.yaml (KedaScalerErrors)
# ──────────────────────────────────────────────────────────────────────────────
kube-state-metrics:
  rbac:
    # Quyền đọc ScaledObject cho ServiceAccount của KSM. Quyền đọc CRD (customresourcedefinitions) chart tự
    # thêm khi bật customResourceState (rbac.customResourceState.createClusterRoleRules mặc định true).
    extraRules:
      - apiGroups: ["keda.sh"]
        resources: ["scaledobjects"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true          # chart tạo ConfigMap từ `config` và thêm cờ --custom-resource-state-config-file
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind: {group: keda.sh, version: v1alpha1, kind: ScaledObject}
            # Tên metric = <prefix>_<name>. Đặt prefix rõ ràng để tên giống metric có sẵn của KSM
            # (kube_horizontalpodautoscaler_status_condition), thay cho prefix mặc định ghép từ group/kind.
            metricNamePrefix: kube_scaledobject
            # Nhãn gắn cho mọi metric của ScaledObject. ServiceMonitor của KSM bật honorLabels nên nhãn
            # `namespace` giữ nguyên là namespace của ScaledObject (không bị đổi thành exported_namespace).
            labelsFromPath:
              namespace: [metadata, namespace]
              scaledobject: [metadata, name]
            metrics:
              - name: status_condition
                help: "Condition of a KEDA ScaledObject (Ready, Active, Fallback, Paused, HPAActive): 1 if True, 0 if False or Unknown."
                each:
                  type: Gauge
                  gauge:
                    # Duyệt từng phần tử của status.conditions: mỗi condition thành một chuỗi, nhãn
                    # `condition` = trường type, giá trị = trường status ("True" → 1, "False"/"Unknown" → 0).
                    path: [status, conditions]
                    labelsFromPath:
                      condition: [type]
                    valueFrom: [status]
