# ──────────────────────────────────────────────────────────────────────────────
# infra/ansible/ansible.cfg
# Khái niệm: Cấu hình mặc định của Ansible. Ansible tự đọc file `ansible.cfg` trong thư mục hiện tại,
#            nên mọi lệnh ansible phải chạy TỪ infra/ansible (Makefile đã `cd` vào đây).
# Mục đích:  Chỉ đường tới roles/, bật pipelining SSH cho nhanh, in kết quả dạng YAML cho dễ đọc.
# Định dạng: INI. `[mục]` rồi `khoá = giá trị`; comment là dòng bắt đầu bằng `#`.
# Tham khảo: docs/huong-dan/w2.md §3.2
# ──────────────────────────────────────────────────────────────────────────────
[defaults]
# Tìm role trong thư mục roles/ cạnh file này (site.yml gọi role theo tên: common, nvidia…)
roles_path = roles
# Tự tìm Python trên máy đích; "silent" = không in cảnh báo về phiên bản Python mỗi lần chạy
interpreter_python = auto_silent
# In kết quả task dạng YAML nhiều dòng thay vì JSON một dòng dài: dễ đọc khi task lỗi
callback_result_format = yaml
# Không tạo file site.retry mỗi khi playbook lỗi (rác, và chạy lại cả playbook vẫn an toàn vì idempotent)
retry_files_enabled = False

[ssh_connection]
# Gửi nhiều lệnh qua một phiên SSH thay vì chép file module sang máy đích rồi chạy: nhanh hơn rõ rệt.
# Yêu cầu sudo không đòi TTY (mặc định trên Ubuntu là được).
pipelining = True
