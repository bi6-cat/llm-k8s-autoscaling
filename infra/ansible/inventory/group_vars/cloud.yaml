# ──────────────────────────────────────────────────────────────────────────────
# infra/ansible/inventory/group_vars/cloud.yaml
# Khái niệm: Biến riêng cho nhóm `cloud` (VM thuê trên Vast). Inventory của nhóm này
#            (inventory/cloud.yaml) do `vast.sh inventory` sinh mỗi lần thuê, nên không nằm trong Git.
# Mục đích:  Kubeconfig đi qua SSH tunnel; bật CPU manager static để pod vLLM Guaranteed có lõi CPU riêng.
# Tham khảo: docs/huong-dan/w2.md §3.2, §11
# ──────────────────────────────────────────────────────────────────────────────
env_name: cloud
argocd_enabled: false       # V0 triển khai tay; Argo CD trên VM bật từ W4
kubeconfig_name: llm-cloud
# API server của VM không mở ra Internet (an toàn hơn). `vast.sh tunnel` chuyển cổng 6443 của VM về
# 127.0.0.1:16443 trên laptop qua SSH; kubeconfig trỏ vào đầu tunnel này.
kubeconfig_server: https://127.0.0.1:16443
# CPU manager static: pod có QoS Guaranteed (requests = limits, CPU số nguyên) được giữ RIÊNG các lõi CPU,
# không bị pod khác chen vào → số đo ổn định hơn. reserved-cpus=0-3: chừa lõi 0–3 cho hệ điều hành,
# k3s và máy tạo tải (Môi trường §3.5).
k3s_kubelet_args:
  - cpu-manager-policy=static
  - reserved-cpus=0-3

# Template VM của Vast bật unattended-upgrades; ngày 08/11 nó nâng driver NVIDIA giữa chừng (role common).
disable_auto_upgrades: true

# Registry mirror: máy Vast đầu tiên (08/11/2026) bị reset kết nối tới registry-1.docker.io, trong khi
# ghcr.io, quay.io, registry.k8s.io vẫn thông. mirror.gcr.io là bản sao Docker Hub của Google, có đúng
# image vllm/vllm-openai theo digest đã ghim. Kéo qua mirror vẫn an toàn: image ghim bằng digest (sha256
# của nội dung), containerd kiểm digest nên mirror không thể trả image khác. Mirror không có image thì
# containerd tự thử tiếp endpoint gốc registry-1.docker.io.
k3s_registry_mirrors:
  docker.io: ["https://mirror.gcr.io"]

# Prefetch (roles/cloud-prefetch). Model và image PHẢI trùng serving/overlays/cloud-3b và serving/overlays/cloud;
# experiments/tests/test_cloud_prefetch.py kiểm điều này, để pod không phải tải lại giữa lúc đo.
cloud_model_repo: Qwen/Qwen2.5-3B-Instruct
cloud_model_revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
cloud_vllm_image: docker.io/vllm/vllm-openai@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
cloud_uv_version: "0.13.7"
cloud_hf_hub_version: "2.4.0"
