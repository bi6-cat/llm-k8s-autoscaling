# ──────────────────────────────────────────────────────────────────────────────
# envs/home/argocd/root-app.yaml
# Khái niệm: Application (CRD của Argo CD) = "đồng bộ thư mục X trong Git vào cluster". App-of-Apps:
#            Application gốc này trỏ vào một thư mục mà mỗi file trong đó lại là một Application con.
# Mục đích:  Đây là thứ DUY NHẤT áp bằng tay (qua role argocd-bootstrap). Thêm một thành phần mới vào
#            cluster nhà = thêm một file Application vào envs/home/argocd/apps/ rồi merge vào main.
#            Root không tự quản lý chính nó (file này nằm ngoài apps/), nên sửa file này phải áp lại:
#            kubectl --context llm-home apply -f envs/home/argocd/root-app.yaml (hoặc make home-up).
# Lưu ý:     Sync tay root kèm `--sync-option …` thì danh sách đó THAY HẲN syncOptions dưới đây (Argo CD
#            v3.5.4 server/application/application.go), mất RespectIgnoreDifferences, và auto-sync của
#            `autoscaling` bị bật lại. Sync tay không kèm cờ đó thì an toàn (đã thử trên kind 15/11).
# Tham khảo: docs/huong-dan/w2.md §4.1, §4.3; Kiến trúc §18.2
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-home
  namespace: argocd                    # mọi Application phải nằm trong namespace của Argo CD
spec:
  project: default                     # AppProject mặc định: không giới hạn repo/namespace (đủ cho đồ án)
  source:
    repoURL: https://github.com/bi6-cat/llm-k8s-autoscaling.git   # repo public: không cần khoá để đọc
    targetRevision: main               # chỉ những gì đã merge vào main mới lên cluster
    path: envs/home/argocd/apps    # thư mục chứa các Application con
  destination:
    server: https://kubernetes.default.svc   # chính cluster đang chạy Argo CD
    namespace: argocd                  # các Application con cũng được tạo trong namespace argocd
  syncPolicy:
    # automated: tự sync khi Git đổi (không cần bấm). prune: xoá khỏi Git thì xoá khỏi cluster.
    # selfHeal: ai sửa tay trên cluster thì Argo CD đưa về đúng như Git (sau vài giây).
    automated: {prune: true, selfHeal: true}
    # RespectIgnoreDifferences: khi sync, giữ nguyên giá trị trên cluster của các trường trong
    # ignoreDifferences (mặc định Argo CD chỉ bỏ qua chúng lúc so sánh, còn lúc sync vẫn áp nguyên Git).
    # Thiếu cờ này thì commit kế tiếp vào apps/ làm root sync lại và bật lại auto-sync của `autoscaling`.
    syncOptions: [RespectIgnoreDifferences=true]
  # Các trường của Application con mà root KHÔNG coi là lệch khỏi Git. Theo mẫu của upstream
  # (Argo CD v3.5.4 docs/operator-manual/cluster-bootstrapping.md, "Ignoring differences in child
  # applications").
  ignoreDifferences:
    # Trước phiên đánh giá, auto-sync của `autoscaling` phải tắt (Kiến trúc §18.2). Không có mục này thì
    # selfHeal của root thấy app con lệch Git và bật lại auto-sync sau vài giây, rồi Argo CD áp lại A2
    # giữa lượt. Chỉ mở cho app `autoscaling`: các app khác vẫn bị Git ép như cũ.
    - group: argoproj.io
      kind: Application
      name: autoscaling
      jsonPointers: [/spec/syncPolicy/automated]
    # Hai trường Argo CD tự ghi lên mọi app con khi có người bấm refresh hay sync tay (argocd app sync,
    # argocd app get --refresh). Không phải cấu hình nên không so với Git. `~1` là cách viết dấu `/`
    # trong JSON pointer (RFC 6901): annotation tên argocd.argoproj.io/refresh.
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1refresh
        - /operation
