<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="548" viewBox="0 0 1240 548" role="img" aria-label="Dữ liệu một lượt chạy: sáu nguồn, thu thập qua ghi trực tiếp, Prometheus và runner, lưu thành một thư mục cho mỗi lượt, rồi căn thời gian và tổng hợp" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Dữ liệu một lượt chạy: sáu nguồn, thu thập qua ghi trực tiếp, Prometheus và runner, lưu thành một thư mục cho mỗi lượt, rồi căn thời gian và tổng hợp</title>
<defs><marker id="a52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#52514e"/></marker><marker id="a4a3aa7" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4a3aa7"/></marker></defs>
<rect x="0.5" y="0.5" width="1239" height="547" rx="14" fill="#fcfcfb" stroke="#e4e3de"/>
<text x="32" y="38" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">Dữ liệu của một lượt chạy: thu thập → lưu trữ → tổng hợp</text>
<text x="32" y="61" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Mọi nguồn đều mang timestamp (các máy đồng bộ giờ bằng NTP); runner gom về một thư mục cho mỗi lượt</text>
<text x="32" y="100" font-size="12" font-weight="700" fill="#52514e" text-anchor="start">NGUỒN</text>
