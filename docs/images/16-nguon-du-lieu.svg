<text x="652" y="170" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">metadata.json</text>
<text x="652" y="187" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">cấu hình, phiên bản, seed</text>
