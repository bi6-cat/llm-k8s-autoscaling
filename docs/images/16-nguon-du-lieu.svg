<text x="652" y="231" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">mốc bắt đầu/kết thúc pha</text>
<text x="652" y="258" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">requests.csv</text>
<text x="652" y="275" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">log từng request</text>
<text x="652" y="302" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">metrics.parquet</text>
