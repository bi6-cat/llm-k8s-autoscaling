<text x="628" y="100" font-size="12" font-weight="700" fill="#52514e" text-anchor="start">LƯU TRỮ (mỗi lượt)</text>
<text x="956" y="100" font-size="12" font-weight="700" fill="#52514e" text-anchor="start">XỬ LÝ</text>
<rect x="32" y="112" width="250" height="52" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
