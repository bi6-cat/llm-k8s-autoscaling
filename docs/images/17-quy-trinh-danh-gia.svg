<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-label="Quy trình phiên đánh giá chính V2 trên VM thuê: thuê và kiểm máy, dựng từ máy trắng không có Argo CD, đo năng lực, vòng lặp 17 lượt, kịch bản vận hành và cold start, kéo dữ liệu về rồi tắt máy, phân tích" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Quy trình phiên đánh giá chính V2 trên VM thuê: thuê và kiểm máy, dựng từ máy trắng không có Argo CD, đo năng lực, vòng lặp 17 lượt, kịch bản vận hành và cold start, kéo dữ liệu về rồi tắt máy, phân tích</title>
<defs><marker id="a52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="1239" height="649" rx="14" fill="#fcfcfb" stroke="#e4e3de"/>
<text x="32" y="38" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">Quy trình phiên đánh giá chính trên GPU thuê (V2)</text>
<text x="32" y="61" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Một lần thuê VM 4 GPU; mọi bước chạy bằng lệnh make hoặc script, runner và máy tạo tải chạy trên chính VM</text>
<rect x="32" y="86" width="344" height="100" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="56" cy="111" r="12" fill="#52514e"/>
<text x="56" y="115.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="76" y="116" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Thuê và kiểm máy</text>
<text x="48" y="142" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">thuê VM 4 GPU trên Vast.ai;</text>
<text x="48" y="159.5" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">make probe: phần cứng, ổ, mạng → giữ máy</text>
<rect x="448" y="86" width="344" height="100" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="472" cy="111" r="12" fill="#52514e"/>
<text x="472" y="115.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="492" y="116" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Dựng từ máy trắng (VH5)</text>
<text x="464" y="142" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">make bootstrap: k3s, GPU, tải sẵn model, image;</text>
<text x="464" y="159.5" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">make cloud-platform: Helm, không Argo CD</text>
<rect x="864" y="86" width="344" height="100" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="888" cy="111" r="12" fill="#52514e"/>
<text x="888" y="115.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="908" y="116" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">ĐG1: đo năng lực</text>
<text x="880" y="142" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">5 mức λ cố định, 1 replica, mỗi mức 300 s;</text>
<text x="880" y="159.5" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">capacity.py → C, B*, threshold A2</text>
<path d="M376,136 L448,136" fill="none" stroke="#52514e" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
<path d="M792,136 L864,136" fill="none" stroke="#52514e" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
<path d="M1036,186 L1036,234" fill="none" stroke="#52514e" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
<rect x="32" y="234" width="1176" height="236" rx="14" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="56" cy="259" r="12" fill="#52514e"/>
<text x="56" y="263.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="76" y="264" font-size="13.5" text-anchor="start"><tspan font-weight="650" fill="#0b0b0b">ĐG2: vòng lặp 17 lượt</tspan><tspan font-weight="400" fill="#52514e">  11 ô (S1, S4, A1, A2 × KB1–KB3, bỏ S1 × KB1), 1–3 lượt mỗi ô, thứ tự xáo trộn · runner (Python) trong tmux trên VM</tspan></text>
<rect x="52" y="286" width="172" height="110" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="66" y="310" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">a. Áp cấu hình</text>
<text x="66" y="334" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">S1, S4: đặt số replica;</text>
<text x="66" y="352" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">A1, A2: ScaledObject</text>
<text x="66" y="370" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">tạm dừng ở 1 replica</text>
<path d="M224,341 L246,341" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
<rect x="246" y="286" width="172" height="110" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="260" y="310" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">b. Reset</text>
<text x="260" y="334" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">1 pod Ready (S4: 4 pod),</text>
<text x="260" y="352" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">hàng đợi trống,</text>
<text x="260" y="370" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">chờ thêm 60 s</text>
<path d="M418,341 L440,341" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
<rect x="440" y="286" width="172" height="110" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="454" y="310" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">c. Warm-up</text>
<text x="454" y="334" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">0,3C trong 2 phút</text>
<text x="454" y="352" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">(không tính kết quả)</text>
<path d="M612,341 L634,341" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
<rect x="634" y="286" width="172" height="110" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="648" y="310" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">d. Chạy kịch bản</text>
<text x="648" y="334" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">bỏ tạm dừng;</text>
<text x="648" y="352" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">λ(t) theo KB1–KB3,</text>
<text x="648" y="370" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">log từng request</text>
<path d="M806,341 L828,341" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
<rect x="828" y="286" width="172" height="110" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="842" y="310" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">e. Thu thập</text>
<text x="842" y="334" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">CSV, Prometheus,</text>
<text x="842" y="352" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">log vLLM, sự kiện pod,</text>
<text x="842" y="370" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">cảnh báo (ALERTS)</text>
<path d="M1000,341 L1022,341" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
<rect x="1022" y="286" width="172" height="110" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="1036" y="310" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">f. Cooldown</text>
<text x="1036" y="334" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">chờ còn 1 replica</text>
<text x="1036" y="352" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">(tối đa 10 phút)</text>
<path d="M1108,396 L1108,420 Q1108,428 1100,428 L146,428 Q138,428 138,420 L138,396" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#a52514e)"/>
<rect x="581.3" y="420" width="83.4" height="18" rx="4" fill="#f4f3ef"/>
<text x="623" y="432" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">lượt tiếp theo</text>
<text x="52" y="458" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">VH1 (pha drop của KB2) và VH6 (cảnh báo so với log client) được ghi trong chính các lượt; PC kéo runs/ của VM về mỗi 30 phút</text>
<path d="M1036,470 L1036,514" fill="none" stroke="#52514e" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
<rect x="864" y="514" width="344" height="100" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="888" cy="539" r="12" fill="#52514e"/>
<text x="888" y="543.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="908" y="544" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Vận hành và cold start</text>
<text x="880" y="570" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">VH2–VH4 dưới tải 0,5C (vh.py);</text>
<text x="880" y="587.5" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">ĐG3: L2 × 3 rồi L0 × 2 (dg3.sh)</text>
<rect x="448" y="514" width="344" height="100" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="472" cy="539" r="12" fill="#52514e"/>
<text x="472" y="543.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="492" y="544" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Kéo dữ liệu, tắt máy</text>
<text x="464" y="570" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">rsync runs/ về PC, khớp sha256 mọi file;</text>
<text x="464" y="587.5" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">poweroff VM, xoá instance</text>
<path d="M864,564 L792,564" fill="none" stroke="#52514e" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
<rect x="32" y="514" width="344" height="100" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="48" y="544" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Phân tích trên PC</text>
<text x="48" y="570" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">build_tables: bảng và biểu đồ chương 5;</text>
<text x="48" y="587.5" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">bảng nghiệm thu N1–N8</text>
<path d="M448,564 L376,564" fill="none" stroke="#52514e" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
</svg>
