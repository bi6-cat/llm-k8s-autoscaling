<text x="48" y="524" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Kết quả</text>
<text x="48" y="550" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">bảng nghiệm thu N1–N8,</text>
<text x="48" y="567.5" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">khuyến nghị cấu hình vận hành</text>
