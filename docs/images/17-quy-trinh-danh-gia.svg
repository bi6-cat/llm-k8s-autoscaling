<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-label="Quy trình phiên đánh giá chính: thuê và dựng từ máy trắng, triển khai, đo năng lực, vòng lặp 17 lượt, cold start và kịch bản vận hành, sao lưu, huỷ máy và phân tích" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Quy trình phiên đánh giá chính: thuê và dựng từ máy trắng, triển khai, đo năng lực, vòng lặp 17 lượt, cold start và kịch bản vận hành, sao lưu, huỷ máy và phân tích</title>
<defs><marker id="a52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="1239" height="619" rx="14" fill="#fcfcfb" stroke="#e4e3de"/>
<text x="32" y="38" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">Quy trình tự động của phiên đánh giá chính trên GPU thuê</text>
<text x="32" y="61" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Một lần thuê liền ~20–22 giờ; mọi bước chạy bằng script để dựng lại được và rút ngắn thời gian thuê GPU</text>
<rect x="32" y="86" width="344" height="100" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="56" cy="111" r="12" fill="#52514e"/>
<text x="56" y="115.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="76" y="116" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Thuê máy &amp; dựng từ đầu</text>
<text x="48" y="142" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">vastai: thuê VM 4 GPU, burn-in rút gọn</text>
<text x="48" y="159.5" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Ansible + Argo CD; đo thời gian (VH5)</text>
<rect x="448" y="86" width="344" height="100" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="472" cy="111" r="12" fill="#52514e"/>
<text x="472" y="115.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="492" y="116" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Triển khai nền tảng</text>
<text x="464" y="142" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Argo CD sync: giám sát, cảnh báo,</text>
<text x="464" y="159.5" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">KEDA, vLLM; tắt auto-sync autoscaling</text>
<rect x="864" y="86" width="344" height="100" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="888" cy="111" r="12" fill="#52514e"/>
<text x="888" y="115.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="908" y="116" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Đo năng lực</text>
<text x="880" y="142" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">quét tốc độ → tìm C của 1 replica</text>
<text x="880" y="159.5" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">chốt SLO, target A1, A2 (ADR-003)</text>
