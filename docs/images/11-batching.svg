<text x="32" y="38" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">Static batching và continuous batching</text>
<text x="32" y="61" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Mỗi hàng là một slot trong batch, mỗi cột là một bước decode (sinh 1 token cho mọi request đang chạy) — đơn giản hoá, bỏ qua prefill</text>
