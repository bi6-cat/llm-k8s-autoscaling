<text x="32" y="532" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">• (a) chỉ chạy được khi còn GPU trống: lúc tải thấp HPA chỉ chạy 1–2 replica nên không kẹt; lúc tải cao thì kẹt.</text>
<text x="32" y="554" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">• (b) không bao giờ kẹt, đổi lại năng lực còn 3/4 trong lúc cập nhật; khi chỉ có 1 replica thì phải tạm nâng minReplicaCount lên 2 trước, nếu không sẽ mất dịch vụ.</text>
<text x="32" y="576" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">• (c) giữ một GPU trống (maxReplicaCount = 3) để dùng (a) mà không giảm năng lực; đổi lại mất 25% năng lực tối đa.</text>
