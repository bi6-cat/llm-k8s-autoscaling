<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="596" viewBox="0 0 1240 596" role="img" aria-label="Rolling update khi cả 4 GPU đều có pod: cấu hình maxSurge 1 maxUnavailable 0 bị kẹt vì pod mới không có GPU; cấu hình maxSurge 0 maxUnavailable 1 xoá pod cũ trước, năng lực còn 3/4 trong suốt lần cập nhật" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Rolling update khi cả 4 GPU đều có pod: cấu hình maxSurge 1 maxUnavailable 0 bị kẹt vì pod mới không có GPU; cấu hình maxSurge 0 maxUnavailable 1 xoá pod cũ trước, năng lực còn 3/4 trong suốt lần cập nhật</title>
<defs><pattern id="hd03b3b" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#d03b3b" stroke-width="1.3"/></pattern></defs>
