<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="352" viewBox="0 0 1120 352" role="img" aria-label="Phân rã cold start minh hoạ: pull image và tải model chiếm phần lớn; cache model, pre-pull image và compile cache rút từ khoảng 5 phút xuống dưới 1 phút" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
