<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="528" viewBox="0 0 1240 528" role="img" aria-label="Scale-down an toàn: khi không có preStop, request đến trong lúc Endpoints chưa cập nhật bị từ chối; có preStop sleep 20 giây thì request đó vẫn được phục vụ" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Scale-down an toàn: khi không có preStop, request đến trong lúc Endpoints chưa cập nhật bị từ chối; có preStop sleep 20 giây thì request đó vẫn được phục vụ</title>
<defs></defs>
<rect x="0.5" y="0.5" width="1239" height="527" rx="14" fill="#fcfcfb" stroke="#e4e3de"/>
<text x="32" y="38" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">Scale-down an toàn: vì sao cần preStop</text>
<text x="32" y="61" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Khi pod bị xoá, việc gỡ pod khỏi Endpoints và việc gửi SIGTERM chạy song song — thiếu preStop, request đến muộn sẽ lỗi</text>
<line x1="400" y1="96" x2="400" y2="424" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="406" y="92" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="start">t = 0: HPA giảm replicas, pod chuyển sang Terminating</text>
<text x="32" y="112" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Không có preStop</text>
<text x="40" y="143" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Endpoints</text>
<text x="40" y="181" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Tiến trình vLLM</text>
<text x="40" y="226" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Request</text>
<rect x="250" y="124" width="150" height="30" rx="5" fill="#eef4fc" stroke="#c9dcf3" stroke-width="1"/>
<text x="325" y="143" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">trong Endpoints</text>
<rect x="400" y="124" width="60" height="30" rx="5" fill="#fdf3dc" stroke="#c98500" stroke-width="1"/>
<text x="430" y="143" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">đang gỡ</text>
<rect x="460" y="124" width="690" height="30" rx="5" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1"/>
<text x="805" y="143" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">đã gỡ khỏi Endpoints: không nhận request mới</text>
<rect x="250" y="162" width="150" height="30" rx="5" fill="#eef4fc" stroke="#c9dcf3" stroke-width="1"/>
<text x="325" y="181" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">phục vụ</text>
<rect x="400" y="162" width="330" height="30" rx="5" fill="#fdf3ee" stroke="#eb6834" stroke-width="1"/>
<text x="565" y="181" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">drain: làm nốt request đang chạy</text>
<rect x="367.2" y="153" width="65.6" height="17" rx="4" fill="#0b0b0b"/>
<text x="400" y="165.5" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">SIGTERM</text>
<circle cx="730" cy="177" r="5" fill="#0b0b0b"/>
<text x="739" y="181" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="start">thoát</text>
<text x="274" y="214" font-size="11" font-weight="650" fill="#0b0b0b" text-anchor="end">R_a</text>
<rect x="280" y="206" width="390" height="10" rx="5" fill="#2a78d6"/>
<rect x="676" y="202" width="50.4" height="18" rx="9" fill="#edf6ed" stroke="#0ca30c" stroke-width="1"/>
<circle cx="685" cy="211" r="3.5" fill="#0ca30c"/>
<text x="692" y="215" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">xong</text>
<text x="418" y="236" font-size="11" font-weight="650" fill="#0b0b0b" text-anchor="end">R_b</text>
<circle cx="430" cy="233" r="6" fill="#d03b3b"/>
<rect x="442" y="224" width="224.2" height="18" rx="9" fill="#fbe9e8" stroke="#d03b3b" stroke-width="1"/>
<circle cx="451" cy="233" r="3.5" fill="#d03b3b"/>
<text x="458" y="237" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">đến lúc 2 s — pod đã ngừng nhận: lỗi</text>
<text x="32" y="284" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Có preStop: sleep 20 s</text>
<text x="40" y="315" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Endpoints</text>
<text x="40" y="353" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Tiến trình vLLM</text>
<text x="40" y="398" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Request</text>
<rect x="250" y="296" width="150" height="30" rx="5" fill="#eef4fc" stroke="#c9dcf3" stroke-width="1"/>
<text x="325" y="315" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">trong Endpoints</text>
<rect x="400" y="296" width="60" height="30" rx="5" fill="#fdf3dc" stroke="#c98500" stroke-width="1"/>
<text x="430" y="315" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">đang gỡ</text>
<rect x="460" y="296" width="690" height="30" rx="5" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1"/>
<text x="805" y="315" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">đã gỡ khỏi Endpoints: không nhận request mới</text>
<rect x="250" y="334" width="450" height="30" rx="5" fill="#eef4fc" stroke="#c9dcf3" stroke-width="1"/>
<text x="475" y="353" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">vẫn phục vụ (preStop đang sleep)</text>
<rect x="700" y="334" width="210" height="30" rx="5" fill="#fdf3ee" stroke="#eb6834" stroke-width="1"/>
<text x="805" y="353" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">drain</text>
<rect x="667.2" y="325" width="65.6" height="17" rx="4" fill="#0b0b0b"/>
<text x="700" y="337.5" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">SIGTERM</text>
<circle cx="910" cy="349" r="5" fill="#0b0b0b"/>
<text x="919" y="353" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="start">thoát</text>
<text x="274" y="386" font-size="11" font-weight="650" fill="#0b0b0b" text-anchor="end">R_a</text>
<rect x="280" y="378" width="390" height="10" rx="5" fill="#2a78d6"/>
<rect x="676" y="374" width="50.4" height="18" rx="9" fill="#edf6ed" stroke="#0ca30c" stroke-width="1"/>
<circle cx="685" cy="383" r="3.5" fill="#0ca30c"/>
<text x="692" y="387" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">xong</text>
<text x="424" y="408" font-size="11" font-weight="650" fill="#0b0b0b" text-anchor="end">R_b</text>
<rect x="430" y="400" width="420" height="10" rx="5" fill="#2a78d6"/>
<rect x="856" y="396" width="230" height="18" rx="9" fill="#edf6ed" stroke="#0ca30c" stroke-width="1"/>
<circle cx="865" cy="405" r="3.5" fill="#0ca30c"/>
<text x="872" y="409" font-size="10.5" font-weight="600" fill="#0b0b0b" text-anchor="start">đến lúc 2 s — vẫn được phục vụ, xong</text>
<line x1="250" y1="432" x2="1150" y2="432" stroke="#c3c2b7" stroke-width="1"/>
<line x1="250" y1="432" x2="250" y2="437" stroke="#c3c2b7" stroke-width="1"/>
<text x="250" y="451" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">-10 s</text>
<line x1="400" y1="432" x2="400" y2="437" stroke="#c3c2b7" stroke-width="1"/>
<text x="400" y="451" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">0 s</text>
<line x1="550" y1="432" x2="550" y2="437" stroke="#c3c2b7" stroke-width="1"/>
<text x="550" y="451" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">10 s</text>
<line x1="700" y1="432" x2="700" y2="437" stroke="#c3c2b7" stroke-width="1"/>
<text x="700" y="451" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">20 s</text>
<line x1="850" y1="432" x2="850" y2="437" stroke="#c3c2b7" stroke-width="1"/>
<text x="850" y="451" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">30 s</text>
<line x1="1000" y1="432" x2="1000" y2="437" stroke="#c3c2b7" stroke-width="1"/>
<text x="1000" y="451" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">40 s</text>
<line x1="1150" y1="432" x2="1150" y2="437" stroke="#c3c2b7" stroke-width="1"/>
<text x="1150" y="451" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">50 s</text>
<text x="32" y="482" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">• preStop giữ tiến trình chạy đến khi kube-proxy và Ingress đều đã ngừng gửi request mới tới pod.</text>
<text x="32" y="504" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">• terminationGracePeriodSeconds tính từ t = 0 (gồm cả preStop) phải lớn hơn preStop + request dài nhất; quá hạn → SIGKILL, request dở dang bị cắt.</text>
</svg>
