<line x1="32" y1="462" x2="32" y2="474" stroke="#0b0b0b" stroke-width="1.3"/>
<line x1="1200" y1="462" x2="1200" y2="474" stroke="#0b0b0b" stroke-width="1.3"/>
<rect x="373.3" y="459" width="485.4" height="19" rx="4" fill="#fcfcfb"/>
<text x="616" y="472" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">từ pha 1: pod đã giữ GPU (tính vào GPU-giờ) nhưng chưa phục vụ request nào</text>
<text x="32" y="510" font-size="12.5" text-anchor="start"><tspan font-weight="650" fill="#0b0b0b">Tổng (ước lượng): </tspan><tspan font-weight="400" fill="#52514e">L0 ≈ 4–8 phút · L1 ≈ 2,5–7 phút · L2 ≈ 0,5–1,5 phút</tspan><tspan font-weight="400" fill="#898781">  — sẽ được thay bằng số đo thực tế</tspan></text>
</svg>
